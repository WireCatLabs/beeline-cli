name: Monthly validation

on:
  schedule:
    - cron: "9 3 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    with:
      platforms: true
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@2913eb7d08bd7aab34bd4deef93d0a9b620699a9 # v0.104.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
